<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 - Завдання 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form>
    <h2>Анкета користувача</h2>

    <label>Ваше ім'я:</label>
    <input type="text" placeholder="Введіть ім'я">

    <label for="email">Електронна пошта:</label>
    <input id="email" type="email" placeholder="example@mail.com">

    <label>Стать:</label>
    <select>
        <option>Чоловіча</option>
        <option>Жіноча</option>
    </select>

    <label>Додаткова інформація про себе:</label>
    <textarea rows="4" placeholder="Розкажіть про свій досвід..."></textarea>

    <button type="submit">Надіслати анкету</button>
</form>

</body>
</html>
