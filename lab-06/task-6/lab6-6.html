<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 - Завдання 6 (Попап)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="google-header">
    <a href="#" class="header-link">Mail</a>
    <a href="#" class="header-link">Images</a>

    <input type="checkbox" id="popup-toggle" class="popup-checkbox">
    <label for="popup-toggle" class="popup-button" tabindex="0" title="Додатки Google">
        <span class="main-icon-btn">⣿</span>
    </label>

    <a href="#" class="header-link icon-link">🔔</a>
    <div class="user-avatar">
        <img src="https://pravatar.cc" alt="Avatar">
    </div>

    <!-- ПОПАП КОНТЕЙНЕР -->
    <div class="popup-dropdown" tabindex="0">

        <div class="apps-grid">
            <a href="#" class="app-item"><span class="app-icon color-blue">📅</span><span class="app-name">Calendar</span></a>
            <a href="#" class="app-item"><span class="app-icon color-red">✉️</span><span class="app-name">Mail</span></a>
            <a href="#" class="app-item"><span class="app-icon color-blue-alt">📰</span><span class="app-name">News</span></a>

            <a href="#" class="app-item"><span class="app-icon color-green">🗺️</span><span class="app-name">Map</span></a>
            <a href="#" class="app-item"><span class="app-icon color-yellow">📁</span><span class="app-name">Files</span></a>
            <a href="#" class="app-item"><span class="app-icon color-green-alt">👤</span><span class="app-name">Contacts</span></a>

            <a href="#" class="app-item"><span class="app-icon color-purple">🌐</span><span class="app-name">Translate</span></a>
            <a href="#" class="app-item"><span class="app-icon color-red">▶️</span><span class="app-name">Videos</span></a>
            <a href="#" class="app-item"><span class="app-icon color-blue">🔍</span><span class="app-name">Search</span></a>
        </div>

        <input type="checkbox" id="more-toggle" class="more-checkbox">

        <div class="more-apps-container">
            <div class="apps-grid">
                <a href="#" class="app-item"><span class="app-icon color-yellow">🖼️</span><span class="app-name">Photo</span></a>
                <a href="#" class="app-item"><span class="app-icon color-green">💠</span><span class="app-name">Apps</span></a>
                <a href="#" class="app-item"><span class="app-icon color-blue-alt">📄</span><span class="app-name">Document</span></a>

                <a href="#" class="app-item"><span class="app-icon color-purple">💬</span><span class="app-name">Chat</span></a>
                <a href="#" class="app-item"><span class="app-icon color-green-alt">🏫</span><span class="app-name">Classroom</span></a>
                <a href="#" class="app-item"><span class="app-icon color-blue">⭐</span><span class="app-name">Collection</span></a>

                <a href="#" class="app-item"><span class="app-icon color-red">🔴</span><span class="app-name">Mars</span></a>
                <a href="#" class="app-item"><span class="app-icon color-yellow">💻</span><span class="app-name">Blogs</span></a>
                <a href="#" class="app-item"><span class="app-icon color-blue">📢</span><span class="app-name">Promos</span></a>
            </div>
            <div class="more-footer">
                <a href="#" class="more-footer-link">Even more from Kottans</a>
            </div>
        </div>

        <label for="more-toggle" class="btn-more" tabindex="0">More</label>

    </div>
</header>

</body>
</html>
