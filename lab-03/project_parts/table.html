<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
</head>
<body>

<!-- Вирівнювання всього вмісту по центру вікна браузера -->
<div align="center">

    <br><br>

    <!-- ЗОВНІШНЯ ТАБЛИЦЯ (ШАР 3) -->
    <table border="2" cellspacing="0" cellpadding="0" width="400" height="400">
        <!-- Верхня горизонтальна лінія -->
        <tr>
            <td colspan="3" bgcolor="#00ffee" height="35"></td>
        </tr>
        <!-- Середня частина із бічними панелями та вкладеною таблицею -->
        <tr>
            <td bgcolor="#ffffd0" width="35"></td>
            <td align="center" valign="middle">

                <!-- ВНУТРІШНЯ ТАБЛИЦЯ (ШАР 2) -->
                <table border="2" cellspacing="0" cellpadding="0" width="326" height="326">
                    <tr>
                        <td colspan="3" bgcolor="#00ffee" height="35"></td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffd0" width="35"></td>
                        <td align="center" valign="middle">

                            <!-- НАЙБЛИЖЧА ДО ЦЕНТРУ ТАБЛИЦЯ (ШАР 1) -->
                            <table border="2" cellspacing="0" cellpadding="0" width="252" height="252">
                                <tr>
                                    <td colspan="3" bgcolor="#00ffee" height="35"></td>
                                </tr>
                                <tr>
                                    <td bgcolor="#ffffd0" width="35"></td>
                                    <td align="center" valign="middle">

                                        <!-- ЦЕНТРАЛЬНЕ ЯДРО 2х2 -->
                                        <table border="2" cellspacing="0" cellpadding="0" width="178" height="178">
                                            <tr>
                                                <td bgcolor="red" width="89" height="89"></td>
                                                <td bgcolor="blue" width="89"></td>
                                            </tr>
                                            <tr>
                                                <td bgcolor="#00ff00" height="89"></td>
                                                <td bgcolor="yellow"></td>
                                            </tr>
                                        </table>

                                    </td>
                                    <td bgcolor="#ffffd0" width="35"></td>
                                </tr>
                                <tr>
                                    <td colspan="3" bgcolor="#00ffee" height="35"></td>
                                </tr>
                            </table>

                        </td>
                        <td bgcolor="#ffffd0" width="35"></td>
                    </tr>
                    <tr>
                        <td colspan="3" bgcolor="#00ffee" height="35"></td>
                    </tr>
                </table>

            </td>
            <td bgcolor="#ffffd0" width="35"></td>
        </tr>
        <!-- Нижня горизонтальна лінія -->
        <tr>
            <td colspan="3" bgcolor="#00ffee" height="35"></td>
        </tr>
    </table>

    <br><br>

    <!-- Обов'язкове гіперпосилання для повернення на головну сторінку -->
    <p><a href="../index.html">Повернутись на головну</a></p>

</div>

</body>
</html>
