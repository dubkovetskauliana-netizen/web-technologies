<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Картина Мондріана</title>
</head>
<body>

<!-- Вирівнювання всього вмісту по центру вікна браузера -->
<div align="center">

    <br><br>

    <!-- Таблиця-картина (чорні лінії зроблені через колір таблиці та cellspacing) -->
    <table bgcolor="#000000" border="0" cellspacing="5" cellpadding="0" width="500" height="500">

        <!-- РЯДОК 1 -->
        <tr>
            <td bgcolor="#ffffff" width="60" height="50"></td>
            <td bgcolor="#ffffff" colspan="2"></td>
            <td bgcolor="#fffa69" width="130" rowspan="2"></td>
        </tr>

        <!-- РЯДОК 2 -->
        <tr>
            <td bgcolor="#ffffff" height="230" rowspan="2"></td>
            <td bgcolor="#ff5b2d" width="250" height="260" colspan="2" rowspan="2"></td>
        </tr>

        <!-- РЯДОК 3 -->
        <tr>
            <td bgcolor="#ffffff" height="110" rowspan="2"></td>
        </tr>

        <!-- РЯДОК 4 -->
        <tr>
            <td bgcolor="#ffffff" height="40"></td>
            <td bgcolor="#ffffff" colspan="2"></td>
        </tr>

        <!-- РЯДОК 5 -->
        <tr>
            <td bgcolor="#fffa69" height="90" rowspan="2"></td>
            <td bgcolor="#000000" width="110" height="170" rowspan="2"></td>
            <td bgcolor="#ffffff" width="140"></td>
            <td bgcolor="#074481" height="120"></td>
        </tr>

        <!-- РЯДОК 6 -->
        <tr>
            <td bgcolor="#ffffff" height="40" colspan="2"></td>
        </tr>

    </table>

    <br><br>

    <!-- Обов'язкове гіперпосилання для повернення на головну сторінку -->
    <p><a href="../index.html">Повернутись на головну</a></p>

</div>

</body>
</html>
